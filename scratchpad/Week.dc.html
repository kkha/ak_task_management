<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      color: #0f172a;
    }

    .week-view {
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
    }

    .week-header {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    .week-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .week-label {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
    }

    .day-column {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      min-height: 400px;
    }

    .day-column.today {
      border: 2px solid #4f46e5;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
    }

    .day-date {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .day-date.today {
      color: #4f46e5;
    }

    .day-dow {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .day-tasks {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .day-task {
      padding: 8px;
      background: #f8fafc;
      border-left: 3px solid #4f46e5;
      border-radius: 6px;
      font-size: 12px;
      color: #475569;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-task:hover {
      background: #f1f5f9;
      transform: translateX(2px);
    }

    .day-task.priority {
      border-left-color: #ef4444;
      background: #fef2f2;
    }

    .progress-bar {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }

    .progress-label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 6px;
    }

    .progress-fill {
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-inner {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5 0%, #818cf8 100%);
    }
  </style>
</helmet>

<div class="week-view">

    <!-- 토요일 (오늘) -->
