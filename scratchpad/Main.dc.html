<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      color: #0f172a;
    }

    .ak-app {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
      gap: 0;
    }

    /* === 사이드바 === */
    .sidebar {
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      padding: 0;
      box-shadow: -1px 0 0 0 inset #e2e8f0;
    }

    .sidebar__header {
      padding: 20px 16px;
      border-bottom: 1px solid #e2e8f0;
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
    }

    .sidebar__title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #0f172a;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .sidebar__nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      transition: all 0.2s ease;
    }

    .nav-item:hover {
      background: #f1f5f9;
      color: #475569;
    }

    .nav-item.active {
      background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
      color: #4f46e5;
      font-weight: 600;
    }

    .nav-item__icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    /* === 메인 컨텐츠 === */
    .main-container {
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
    }

    .header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    .header__title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .header__actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn--primary {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .btn--primary:hover {
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
      transform: translateY(-1px);
    }

    .btn--secondary {
      background: #f1f5f9;
      color: #475569;
    }

    .btn--secondary:hover {
      background: #e2e8f0;
    }

    /* === 콘텐츠 영역 === */
    .content {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 16px;
      padding: 20px;
      overflow: auto;
    }

    /* === 캘린더 패널 === */
    .calendar-panel {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      height: fit-content;
      position: sticky;
      top: 20px;
    }

    .calendar__month {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    .calendar__grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 12px;
    }

    .calendar__day-header {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      padding: 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .calendar__day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #64748b;
      position: relative;
    }

    .calendar__day:hover {
      background: #f1f5f9;
      color: #475569;
    }

    .calendar__day.active {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .calendar__day.has-task::after {
      content: '';
      position: absolute;
      width: 4px;
      height: 4px;
      background: #4f46e5;
      border-radius: 50%;
      bottom: 2px;
    }

    /* === 작업 목록 === */
    .tasks-panel {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    .tasks__header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    .tasks__count {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .task-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: #f8fafc;
      transition: all 0.2s ease;
      align-items: flex-start;
    }

    .task-item:hover {
      background: #f1f5f9;
      transform: translateX(2px);
    }

    .task-item__checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .task-item__checkbox:hover {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .task-item__checkbox.checked {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      border-color: #4f46e5;
      color: #ffffff;
    }

    .task-item__content {
      flex: 1;
      min-width: 0;
    }

    .task-item__text {
      font-size: 13px;
      color: #0f172a;
      font-weight: 500;
      line-height: 1.4;
      word-break: break-word;
    }

    .task-item__meta {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .task-item__tag {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .task-item__tag--work {
      background: #fef3c7;
      color: #92400e;
    }

    .task-item__tag--personal {
      background: #dbeafe;
      color: #1e40af;
    }

    .task-item__tag--study {
      background: #dcfce7;
      color: #166534;
    }

    .task-item__priority {
      font-size: 10px;
      color: #ef4444;
      font-weight: 700;
    }

    .task-item.done .task-item__text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    /* === 진행률 === */
    .progress {
      margin-top: 16px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
    }

    .progress__label {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }

    .progress__bar {
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress__fill {
      height: 100%;
      background: linear-gradient(90deg, #4f46e5 0%, #818cf8 100%);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    @media (max-width: 1200px) {
      .content {
        grid-template-columns: 1fr;
      }
      .calendar-panel {
        position: static;
      }
    }

    @media (max-width: 768px) {
      .ak-app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none;
      }
    }
  </style>
</helmet>

<script data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]}}'>

</script>
