<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fafbfc;
      color: #1e293b;
      letter-spacing: -0.3px;
    }

    .week-view {
      display: flex;
      flex-direction: column;
      padding: 28px;
      gap: 24px;
    }

    .week-header {
      background: #ffffff;
      border-radius: 14px;
      padding: 24px;
      border: 1px solid #f1f5f9;
    }

    .week-title {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .week-label {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 14px;
    }

    .day-column {
      background: #ffffff;
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #f1f5f9;
      min-height: 420px;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .day-column:hover {
      border-color: #e2e8f0;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .day-column.today {
      border: 2px solid #6366f1;
      background: linear-gradient(135deg, #f8fafc 0%, #f0f4ff 100%);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.15);
    }

    .day-date {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .day-date.today {
      color: #6366f1;
    }

    .day-dow {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    .day-tasks {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .day-task {
      padding: 10px;
      background: #f8fafc;
      border-left: 3px solid #6366f1;
      border-radius: 6px;
      font-size: 13px;
      color: #475569;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-task:hover {
      background: #f1f5f9;
      border-left-color: #f97316;
      transform: translateX(2px);
    }

    .day-task.priority {
      border-left-color: #f97316;
      background: #fff7ed;
    }

    .day-task.done {
      opacity: 0.5;
      text-decoration: line-through;
    }

    .progress-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }

    .progress-percent {
      font-size: 12px;
      font-weight: 700;
      color: #6366f1;
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 5px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1 0%, #f97316 100%);
    }

    @media (max-width: 1400px) {
      .week-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 900px) {
      .week-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</helmet>
